name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      # GLM Coding Plan (z.ai global) via its Anthropic-compatible endpoint.
      # Auth flows through ANTHROPIC_AUTH_TOKEN; the anthropic_api_key input
      # below must still be populated for the action to start.
      ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.GLM_API_KEY }}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.3-flash[1m]
      ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3[1m]
      ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3[1m]
      API_TIMEOUT_MS: 3000000
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.GLM_API_KEY }}
          track_progress: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Read-only commands allowlisted so large PRs don't die in
          # permission-denial retry loops (see PR #9's 27-min failure).
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(ls:*)"'
